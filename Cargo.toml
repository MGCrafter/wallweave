[package]
name = "wallweave"
version = "0.2.4"
edition = "2024"
rust-version = "1.88"
description = "A native Linux desktop app for existing Wallpaper Engine libraries"
license = "MIT"
readme = "README.md"
repository = "https://github.com/MGCrafter/wallweave"
homepage = "https://github.com/MGCrafter/wallweave"
keywords = ["wallpaper", "linux", "steam", "wayland", "desktop"]
categories = ["gui", "command-line-utilities"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:image"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"
fs2 = "0.4"
nix = { version = "0.30", features = ["signal", "process", "user"] }
tempfile = "3"
ctrlc = { version = "3", features = ["termination"] }
steamworks = "0.13.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
eframe = { version = "0.31.1", optional = true, default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "accesskit"] }
rfd = { version = "0.16", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[profile.release]
lto = "thin"
strip = true

[lints.clippy]
unwrap_used = "warn"
